name: Docker Image CI

on:
  push:
    branches: [ "main" ]

permissions:
  content: "write"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Config credenciais DockerHub
        uses: docker/login-action@v2
        with: 
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASS }}
      
      - name: Build and push image
        uses: docker/build-push-action@v5                                      # Usa a ação oficial do Docker para build e push
        with :
          context: .                                                           # Usa o diretório atual como contexto do build
          push: true                                                           # Habilita o push da imagem após o build
          tags: |                                                              # Define as tags para a imagem
            ${{ secrets.DOCKER_HUB_USERNAME }}/desafio-sre:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/desafio-sre:v${{ github.run_id }}
           
          # Desabilita a adição automática de tags baseadas no ref
          #tags-from-ref: false

  modifygit: 
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
     
      - name: Atualizando imagem do deployment
        run: |
          git config user.email lucasmenezes9251@gmail.com
          git config user.name lumr92
          cd k8s/deployment
          pwd
          cat deploy-app.yaml
          pwd
          sed -i "s+lumr92/desafio-sre.*+lumr92/desafio-sre:v$RUN_ID+g" deploy-app.yaml
          cat deploy-app.yaml
          git add .
          git commit -m "Done by Github Actions Job mudança de manifesto: $RUN_ID"
          git push origin main
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          RUN_ID: ${{ github.run_id }}

