apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desafio-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lumr92/desafio-ps-sre.git
    path: k8s/deployment
    targetRevision: HEAD
    directory:
      recurse: true
      exclude: 'argocd-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true