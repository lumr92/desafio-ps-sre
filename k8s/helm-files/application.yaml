apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desafio-app
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/lumr/desafio-ps-sre.git
    path: k8s/helm-files/
    targetRevision: HEAD
    directory:
      recurse: true
    destination:
      server: https://192.168.1.100:8443
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      