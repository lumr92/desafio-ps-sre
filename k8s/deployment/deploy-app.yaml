apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-desafio-deployment
  namespace: default
spec:
  replicas: 1
  template:
    metadata:
      name: app-desafio-sre
      labels:
        app: app-desafio-sre
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app-container
          image: lumr/desafio-sre:v17501604502
          ports:
            - containerPort: 5000
              name: http-web
            - containerPort: 8080
              name: http-metrics
          envFrom:
            - configMapRef:
                name: configmap-postgres
            - configMapRef:
                name: configmap-redis
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-postgres
                  key: POSTGRES_PASSWORD
            - name: ENABLE_TELEMETRY
              value: "true"
            - name: SERVICE_NAME
              value: svc-app
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              value: "production"

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_NAME
              value: "Desafio-cluster-eks-LucasMenezes"

              
  selector:
    matchLabels:
      app: app-desafio-sre
